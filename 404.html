<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found — Pink Pixel Studio</title>
  <meta name="description" content="The page you are looking for does not exist. Return to Pink Pixel Studio home." />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://pinkpixel.design/" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <meta name="theme-color" content="#0b040d" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0b040d;
      color: #fff4f2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background-image:
        radial-gradient(circle at 22% 30%, rgba(185, 119, 144, 0.25), transparent 45%),
        radial-gradient(circle at 78% 70%, rgba(216, 184, 144, 0.18), transparent 40%);
    }
    .wrap { max-width: 32rem; }
    .mascot { width: 7rem; height: 7rem; object-fit: contain; margin-bottom: 1.5rem; }
    .code {
      font-size: 6rem;
      font-weight: 700;
      letter-spacing: -0.05em;
      line-height: 1;
      margin: 0 0 1rem;
      background: linear-gradient(180deg, #fff4f2 0%, #b97790 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    h1 {
      font-family: 'Syne', 'Georgia', serif;
      font-size: 2rem;
      font-weight: 700;
      margin: 0 0 1rem;
      letter-spacing: -0.03em;
    }
    p { color: rgba(255, 244, 242, 0.7); font-size: 1rem; line-height: 1.55; margin: 0 0 2rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.9rem 1.5rem;
      border-radius: 999px;
      background: linear-gradient(135deg, #b97790 0%, #d8b890 100%);
      color: #0b040d;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(185, 119, 144, 0.3); }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="mascot" src="/mascot.png" alt="Pink Pixel mascot" />
    <div class="code">404</div>
    <h1>This page does not exist</h1>
    <p>The link you followed may be broken, or the page may have been moved. Let's get you back to something useful.</p>
    <a class="btn" href="/">← Back to home</a>
  </div>
</body>
</html>
