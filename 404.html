<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — Pink Pixel Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", sans-serif;
      background: #0b040d;
      color: #fff4f2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
    .content {
      position: relative; z-index: 1;
      text-align: center; padding: 2rem;
      display: flex; flex-direction: column; align-items: center; gap: 1.5rem;
    }
    .error-code {
      font-family: "Syne", sans-serif;
      font-size: clamp(6rem, 20vw, 14rem);
      font-weight: 800;
      letter-spacing: -0.06em;
      line-height: 0.9;
      background: linear-gradient(135deg, #b97790, #7f34a4, #d8b890);
      background-size: 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: gradient-shift 6s ease infinite;
    }
    @keyframes gradient-shift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    h1 {
      font-family: "Syne", sans-serif;
      font-size: clamp(1.4rem, 3vw, 2rem);
      letter-spacing: -0.03em;
      font-weight: 700;
    }
    p { color: rgba(255, 244, 242, 0.6); max-width: 28rem; font-size: 1rem; line-height: 1.6; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.9rem 2rem; border-radius: 999px; border: none;
      background: rgba(255, 255, 255, 0.06);
      color: #fff4f2; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: background 0.3s ease, box-shadow 0.3s ease;
      text-decoration: none;
      position: relative; overflow: hidden;
    }
    .back-btn::before {
      content: ""; position: absolute; inset: -2px; border-radius: inherit; padding: 2px;
      background: linear-gradient(45deg, #b97790, #7f34a4, #d8b890, #f0d6dc, #b97790);
      background-size: 400%; animation: gradient-shift 8s linear infinite;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude; pointer-events: none; z-index: -1; opacity: 0.5;
    }
    .back-btn:hover { background: rgba(255, 255, 255, 0.1); box-shadow: 0 0 30px rgba(185, 119, 144, 0.2); }
    .back-btn:hover::before { opacity: 1; }
    .cube-wrapper {
      position: absolute; width: 120px; height: 120px;
      perspective: 600px; z-index: 1; opacity: 0.15;
    }
    .cube {
      width: 100%; height: 100%;
      transform-style: preserve-3d;
      animation: cube-rotate 20s linear infinite;
    }
    .cube .face {
      position: absolute; width: 120px; height: 120px;
      border: 1px solid rgba(185, 119, 144, 0.3);
      background: rgba(185, 119, 144, 0.03);
    }
    .cube .front  { transform: translateZ(60px); }
    .cube .back   { transform: translateZ(-60px) rotateY(180deg); }
    .cube .left   { transform: translateX(-60px) rotateY(-90deg); }
    .cube .right  { transform: translateX(60px) rotateY(90deg); }
    .cube .top    { transform: translateY(-60px) rotateX(90deg); }
    .cube .bottom { transform: translateY(60px) rotateX(-90deg); }
    @keyframes cube-rotate {
      0% { transform: rotateX(0deg) rotateY(0deg); }
      100% { transform: rotateX(360deg) rotateY(360deg); }
    }
    .cube-1 { top: 15%; left: 8%; }
    .cube-2 { bottom: 20%; right: 10%; animation-delay: -5s; }
    .cube-2 .cube { animation-direction: reverse; animation-duration: 25s; }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>

  <div class="cube-wrapper cube-1">
    <div class="cube">
      <div class="face front"></div><div class="face back"></div>
      <div class="face left"></div><div class="face right"></div>
      <div class="face top"></div><div class="face bottom"></div>
    </div>
  </div>
  <div class="cube-wrapper cube-2">
    <div class="cube">
      <div class="face front"></div><div class="face back"></div>
      <div class="face left"></div><div class="face right"></div>
      <div class="face top"></div><div class="face bottom"></div>
    </div>
  </div>

  <div class="content">
    <div class="error-code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back to something that works.</p>
    <a href="index.html" class="back-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to homepage
    </a>
  </div>

  <script>
    (function() {
      var canvas = document.getElementById('bg-canvas');
      var ctx = canvas.getContext('2d');
      var dpr = window.devicePixelRatio || 1;
      var W, H, particles = [], count = 80;

      function resize() {
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = W * dpr; canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize);

      for (var i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * 2000, y: Math.random() * 1200,
          vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4,
          sz: 1 + Math.random() * 1.5
        });
      }

      function tick() {
        ctx.clearRect(0, 0, W, H);
        for (var i = 0; i < count; i++) {
          var p = particles[i];
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0 || p.x > W) p.vx *= -1;
          if (p.y < 0 || p.y > H) p.vy *= -1;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.sz, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(185,119,144,0.4)';
          ctx.fill();
          for (var j = i + 1; j < count; j++) {
            var q = particles[j];
            var dx = p.x - q.x, dy = p.y - q.y;
            var dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 160) {
              ctx.beginPath();
              ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y);
              ctx.strokeStyle = 'rgba(185,119,144,' + (0.12 * (1 - dist / 160)).toFixed(3) + ')';
              ctx.lineWidth = 0.6;
              ctx.stroke();
            }
          }
        }
        requestAnimationFrame(tick);
      }
      tick();
    })();
  </script>
</body>
</html>
